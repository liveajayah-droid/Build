name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL zip source code Flutter'
        required: true
      tag:
        description: 'Tag release tujuan'
        required: true
      build_type:
        description: 'Tipe build (release/debug)'
        required: false
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source zip
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" -o source.zip
          unzip -q source.zip -d source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: source

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_type }}
        working-directory: source

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: source/build/app/outputs/flutter-apk/app-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
